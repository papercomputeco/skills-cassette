name: Nightly Build & Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: depot-ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check
        run: |
          LAST_SHA=$(
            gh run list \
              --workflow nightly.yaml \
              --status success \
              --limit 1 \
              --json headSha -q '.[0].headSha' || echo ""
          )

          echo "Last successful build SHA: ${LAST_SHA:-none}"
          echo "Current SHA: ${{ github.sha }}"

          if [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Move nightly tag up to HEAD
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Push nightly image
        run: |
          nix develop --command dagger call \
            build-push-image \
              --registry=${{ vars.REGISTRY }} \
              --tags="nightly" \
              --version="nightly"
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Build and upload nightly artifacts
        run: |
          nix develop --command dagger call \
            nightly \
              --endpoint=env://BUCKET_ENDPOINT \
              --bucket=env://BUCKET_NAME \
              --access-key-id=env://BUCKET_ACCESS_KEY_ID \
              --secret-access-key=env://BUCKET_SECRET_ACCESS_KEY \
            export \
              --path=./build
        env:
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Update nightly GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly Build & Release"
          body: |
            **Automated nightly build**

            This is an unstable development build off the tip of `main`.

            Commit: ${{ github.sha }}

            **Download:**
            - Linux AMD64: `curl -LO https://download.tapes.dev/skills-cassette/nightly/linux/amd64/skills-cassette`
            - Linux ARM64: `curl -LO https://download.tapes.dev/skills-cassette/nightly/linux/arm64/skills-cassette`
            - macOS AMD64: `curl -LO https://download.tapes.dev/skills-cassette/nightly/darwin/amd64/skills-cassette`
            - macOS ARM64: `curl -LO https://download.tapes.dev/skills-cassette/nightly/darwin/arm64/skills-cassette`
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to GitHub release
        run: |
          mkdir -p dist
          for file in $(find build -type f); do
            rel_path="${file#build/}"
            os=$(dirname "$rel_path" | cut -d'/' -f1)
            arch=$(dirname "$rel_path" | cut -d'/' -f2)
            filename=$(basename "$file")

            if [[ "$filename" == *.sha256 ]]; then
              base="${filename%.sha256}"
              binary_name="${base}-${os}-${arch}"
              new_name="${binary_name}.sha256"
              checksum=$(cut -d' ' -f1 "$file")
              printf '%s  %s\n' "$checksum" "$binary_name" > "dist/$new_name"
            else
              new_name="${filename}-${os}-${arch}"
              cp "$file" "dist/$new_name"
            fi
          done

          gh release upload nightly dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
