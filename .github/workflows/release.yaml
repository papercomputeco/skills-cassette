name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "manifest-version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.REGISTRY }}/skills-cassette:${{ github.event.release.tag_name }}
            ${{ vars.REGISTRY }}/skills-cassette:latest
          build-args: |
            LDFLAGS=-s -w -X github.com/papercomputeco/skills-cassette/cmd/skills-cassette.Version=${{ github.event.release.tag_name }} -X github.com/papercomputeco/skills-cassette/internal/server.Version=${{ steps.metadata.outputs.manifest-version }}
          cache-from: type=gha,scope=skills-cassette
          cache-to: type=gha,mode=max,scope=skills-cassette
          provenance: false
          sbom: false
