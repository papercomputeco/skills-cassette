# The skills cassette's publishable manifest.
#
# This is the authored form of the metadata this cassette serves at `/openapi`
# under the `x-tapes-cassette` extension. It is the artifact a registry or an
# orchestrator reads *before* anything is running: which contract of Tapes it
# needs, what tables it owns, and what a deployment has to supply to it.
#
# This is not a second schema — the field names below are the JSON field names
# of `cassette/v1alpha1`, and this file must stay in sync with the extension
# built in internal/server/openapi.go for the same installation identity.
#
# The Tapes API server reads none of this. Core discovers and aggregates a
# cassette purely from the OpenAPI document it fetches over HTTP; this file is
# for whoever has to start the thing in the first place.

kind = "cassette/v1alpha1"

# Who this cassette is, and what a deployment needs in order to run it.
# `name` is the identity everything else derives from:
# the public route (/v1/cassettes/skills), the local prefix (/api/skills),
# the Postgres schema ("skills"), and the role ("cassette_skills").
[cassette]
name = "skills"
# Placeholder, not a maintained number: the release stamps the tag it builds
# into the image, and a source tree is not a release. The published identity
# of any given image is the tag it was released under. See internal/server.
version = "0.0.0"
display_name = "Skills"
description = "Stores immutable skill revisions and orchestrates durable generation from Tapes sessions."
license = "MIT OR Apache-2.0"
homepage = "https://github.com/papercomputeco/skills-cassette"
image = "public.ecr.aws/g4e5l3z3/papercomputeco/skills-cassette:v0.0.0"
port = 9998

# What this cassette needs from Tapes. It reads no contract views: source
# transcripts come from the core's own trace API over HTTP
# (GET /v1/traces?session_id= and GET /v1/traces/{id}), so the cassette never
# holds a core database credential.
[depends]
core = "v1"
views = []

# The only database contracts this cassette publishes are the immutable skill
# and revision identity bridges used by downstream migrations. They intentionally
# omit revision content and all mutable or authorization-bearing metadata.
[publishes]
views = ["skills_contract_v1.skill_identities", "skills_contract_v1.revision_identities"]

# Where the things core needs live on this cassette's own listener. The API is
# served under /api/skills and core republishes it under /v1/cassettes/skills.
[api]
health = "/ping"
openapi = "/openapi"
prefix_path = "api"

# Tables this cassette owns in its own schema. The declaration is for whoever
# provisions the database — core neither creates the schema nor grants access
# to it. The cassette runs its own migrations for these tables at startup.
[[tables]]
name = "skills"

[[tables]]
name = "skill_revisions"

[[tables]]
name = "skill_revision_visibility"

[[tables]]
name = "skill_generations"

[[tables]]
name = "generation_sessions"

[[tables]]
name = "generation_candidates"

[[tables]]
name = "candidate_evaluations"

[[tables]]
name = "generation_diagnostics"

# Configuration this cassette accepts, published as schema so a deployment can
# render a form or validate values. Tapes never supplies these; the deployment
# does, through the CASSETTE_* environment. The database DSN arrives separately
# as TAPES_DATABASE_URL; without one the cassette runs on a non-durable
# in-memory store.
[[config]]
key = "core.url"
type = "string"
required = true
description = "Tapes core API origin used for trace reads and tenant-local skills-evaluator calls."

[[config]]
key = "llm.provider"
type = "string"
default = "openai"
enum = ["openai", "anthropic", "ollama"]
description = "LLM provider used to generate independent per-session candidates."

[[config]]
key = "llm.model"
type = "string"
description = "Model override; each provider has a sensible default."

[[config]]
key = "llm.api_key"
type = "string"
secret = true
description = "Provider API key. Not required for ollama."

[[config]]
key = "llm.base_url"
type = "string"
description = "Provider base URL override for proxies and self-hosted endpoints."

[[config]]
key = "generation.worker_concurrency"
type = "int"
default = 2
min = 1
max = 64
description = "Maximum concurrently claimed generations in this cassette process."

[[config]]
key = "generation.max_sessions"
type = "int"
default = 8
min = 1
max = 100
description = "Maximum selected sessions processed by one asynchronous generation."

[[config]]
key = "generation.candidate_concurrency"
type = "int"
default = 2
min = 1
max = 100
description = "Requested candidate-generation and candidate-evaluation external-call concurrency per generation; the effective value is deterministically min(candidate_concurrency, max_sessions)."

[[config]]
key = "generation.poll_interval_ms"
type = "int"
default = 250
min = 10
max = 60000
description = "Initial empty-queue and polling failure delay in milliseconds."

[[config]]
key = "generation.max_poll_interval_ms"
type = "int"
default = 5000
min = 10
max = 300000
description = "Maximum exponential empty-queue and polling failure delay in milliseconds."

[[config]]
key = "generation.lease_duration_ms"
type = "int"
default = 120000
min = 1000
max = 3600000
description = "Generation claim lease duration in milliseconds."

[[config]]
key = "generation.heartbeat_interval_ms"
type = "int"
default = 30000
min = 100
max = 600000
description = "Claim renewal interval in milliseconds; it must remain shorter than the lease duration."

[[config]]
key = "generation.processing_timeout_ms"
type = "int"
default = 300000
min = 1000
max = 3600000
description = "Maximum wall time for one claimed generation attempt in milliseconds."

[[config]]
key = "generation.drain_timeout_ms"
type = "int"
default = 10000
min = 1000
max = 300000
description = "Maximum graceful worker drain wait in milliseconds after shutdown."

[[config]]
key = "generation.retry_backoff_ms"
type = "int"
default = 1000
min = 10
max = 300000
description = "Initial durable retry delay before bounded jitter in milliseconds."

[[config]]
key = "generation.max_retry_backoff_ms"
type = "int"
default = 30000
min = 10
max = 3600000
description = "Maximum durable retry delay before bounded jitter in milliseconds."

[[config]]
key = "generation.max_attempts"
type = "int"
default = 3
min = 1
max = 10
description = "Maximum durable claim attempts before terminal failure."

[[config]]
key = "generation.max_transcript_bytes"
type = "int"
default = 1048576
min = 4096
max = 1048576
description = "Maximum rendered bytes supplied to any one candidate inference."

# External attachment-view filters. The manifest declares only this generic
# schema; every VALUE — which params exist, which views they read, which
# type_value they select on — is deployment-supplied through CASSETTE_FILTERS.
# Each configured view must serve the canonical attachment shape
# (primitive_type text, primitive_id text, value text); SELECT grants on it
# are deployment-owned, mirroring how depends.views grants work. Absent value:
# the capability is off with zero behavioral change.
[[config]]
key = "filters"
type = "json"
description = "External attachment-view filters: a JSON list of {param, view, type_value, normalize} entries, each wiring one repeatable skills-list query param to a deployment-granted view of the canonical attachment shape (primitive_type, primitive_id, value). Normalize verbs: trim, nfc, casefold. Absent: the capability is off."

# Entities this cassette offers, feeding the platform's entity registry.
# Pure self-description: the cassette declares what it is and knows nothing
# about who consumes the declaration.
[[entities]]
type = "skill"
id_kind = "uuid"
display_name = "Skill"
